name: GLaDOS Auto Checkin

on:
  schedule:
    # GitHub Actions 用 UTC 时间，北京时间 00:10 = UTC 16:10（实际触发可能延迟几分钟到几十分钟）
    - cron: "10 16 * * *"
  workflow_dispatch: # 允许在 Actions 页面手动触发，用于首次验证

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run checkin
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
        run: python glados_checkin.py
