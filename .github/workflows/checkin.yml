name: GLaDOS Auto Checkin

on:
  schedule:
    # GitHub Actions 用 UTC，北京时间 = UTC+8。
    # 每天多个时间点兜底：GitHub 定时任务偶发延迟或漏跑，
    # 脚本对"今日已签到"是幂等的，重复执行无害。
    - cron: "10 16 * * *" # 北京 00:10
    - cron: "10 17 * * *" # 北京 01:10
    - cron: "10 18 * * *" # 北京 02:10
    - cron: "10 19 * * *" # 北京 03:10
  workflow_dispatch: # 允许在 Actions 页面手动触发，用于首次验证

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run checkin
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
        run: python glados_checkin.py
