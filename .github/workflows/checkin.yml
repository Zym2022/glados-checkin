name: GLaDOS Auto Checkin

on:
  schedule:
    # 2026-11 规则变化：积分与"距日切换(北京00:00)的时间"挂钩，越早越高（00:00签=10分，凌晨3-5点=1分）。
    # GitHub 调度延迟普遍 +2~4h 且只会延后：23点档延迟后正好落进 0 点后的高分窗口；
    # 凌晨档做兜底（若 23 点档被准时执行签掉了当天名额，后续点位次日正常签，无损失）。
    - cron: "10 15 * * *" # 北京 23:10（主攻：延迟后落 00:xx-01:xx）
    - cron: "30 15 * * *" # 北京 23:30
    - cron: "50 15 * * *" # 北京 23:50
    - cron: "10 16 * * *" # 北京 00:10
    - cron: "40 16 * * *" # 北京 00:40
    - cron: "10 17 * * *" # 北京 01:10
    - cron: "10 18 * * *" # 北京 02:10
    - cron: "10 19 * * *" # 北京 03:10
  workflow_dispatch: # 允许在 Actions 页面手动触发，用于首次验证

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run checkin
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
        run: python glados_checkin.py
